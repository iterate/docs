packages:
  - packages/*
# Every dependency both packages use is pinned here once and written `catalog:` in each package.json,
# as in iterate/private, whose catalog these versions are copied from; a dependency only one package
# uses keeps its version in that package.json.
cleanupUnusedCatalogs: true
catalog:
  # One Cloudflare toolchain for the Worker: the Vite plugin, the wrangler it builds and deploys
  # with, and the runtime types.
  "@cloudflare/vite-plugin": 1.67.0
  "@cloudflare/workers-types": ^5.20261103.1
  wrangler: 4.157.0

  "@codemirror/autocomplete": ^6.20.3
  "@codemirror/lang-css": ^6.3.1
  "@codemirror/lang-html": ^6.4.12
  "@codemirror/lang-javascript": ^6.2.5
  "@codemirror/lang-json": ^6.0.2
  "@codemirror/lang-markdown": ^6.5.2
  "@codemirror/lang-sql": ^6.10.0
  "@codemirror/lang-yaml": ^6.1.3
  "@codemirror/language": ^6.12.4
  "@codemirror/search": ^6.7.2
  "@codemirror/state": ^6.7.6
  "@codemirror/view": ^6.43.13
  "@pierre/trees": 1.0.0-beta.6
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": 1.170.39
  "@tanstack/react-start": 1.168.58
  "@types/node": ^24.13.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  cn: ^0.4.0
  # The iterate SDK at one of iterate/private's main builds (npm's `main` dist-tag names the newest).
  # @iterate-com/docs peers on it; the Docs app and the tests run on it.
  iterate: 0.4.1-main.20261105T063432Z-a81a857
  lucide-react: ^1.48.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  trpc-cli: 0.17.0
  tsdown: 0.23.0
  # TypeScript 7, the native compiler
  typescript: ^7.0.2
  vite: ^8.3.0
  vitest: ^4.1.11
  yjs: ^13.6.31
  zod: 4.6.5
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # iterate's own builds, taken the day they publish
  - iterate
  - "@iterate-com/capnweb"
  - trpc-cli
  # pinned exactly above, and taken the day it ships, with the packages each release carries
  - miniflare
  - wrangler
  - workerd
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
  - "@cloudflare/unenv-preset"
  - "@cloudflare/vite-plugin"
  - "@cloudflare/workers-types"
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - sharp
  - workerd
overrides:
  # one @codemirror/state, or the editor's extensions fail its instanceof checks
  "@codemirror/state": "catalog:"
  wrangler: "catalog:"
# iterate/private's patch: a ZodError's message survives structuredClone and Durable Object RPC (the
# BrowserSession the SDK's app-session runs), where zod's lazy getter left it empty.
patchedDependencies:
  zod@4.6.5: patches/zod@4.6.5.patch
