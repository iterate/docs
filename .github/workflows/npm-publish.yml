name: npm
# Every main commit publishes this repo's packages whose packed contents changed to npm, under the
# `main` dist-tag, and points each package's `latest` at the same version (scripts/ci/npm-publish.ts
# says how); any other ref, under `canary`, which leaves `latest` alone. Pull requests' builds stay
# on pkg.pr.new (pkg-pr-new.yml): npm is public and permanent, so only reviewed code goes there.
#
# A GitHub Actions workflow, not Depot's: npm's trusted publishing takes an OIDC token from GitHub's
# own runners. Each package's settings on npmjs.com name this repository and this file.
#
# A pull request that can change which packages main publishes, or how, publishes nothing. Its
# `check` job fails until npm is ready for main to publish each package, and says what sets up one
# that is not (README.md "A new package on npm"). The two jobs share no step and never run
# together; they share this file because npm trades a token only for the file a package trusts, so
# a check in a workflow of its own could not ask npm as the one that publishes.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      # which packages: pkg-pr-new.yml's list of folders and the name in each folder's manifest
      # (scripts/ci/npm-publish.test.ts holds every listed one to these)
      - .github/workflows/pkg-pr-new.yml
      - packages/*/package.json
      # how
      - .github/workflows/npm-publish.yml
      - scripts/ci/npm-publish.ts
  workflow_dispatch: {}
# One publish at a time, in push order, so `main` never moves back to an older commit's version. A
# run queued behind another is replaced by a newer push's, which publishes whatever both changed. A
# pull request's run has a group of its own, so that it replaces no publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('npm-check-{0}', github.event.pull_request.number) || 'npm-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile --filter iterate-docs --filter @iterate-com/docs...
      - run: node scripts/ci/npm-publish.ts publish --dist-tag ${{ github.ref == 'refs/heads/main' && 'main' || 'canary' }}
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter iterate-docs
      - run: node scripts/ci/npm-publish.ts check
